apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesonarr
  namespace: monitoring
  labels:
    app: kubesonarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubesonarr
  template:
    metadata:
      labels:
        app: kubesonarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-cp-01
      containers:
      - name: kubesonarr
        image: python:3.12-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            if [ ! -d /data/appdata/kubesonarr/site_pkgs/fastapi ]; then
              pip install --no-cache-dir --target=/data/appdata/kubesonarr/site_pkgs -r /app/requirements.txt
            fi
            export PYTHONPATH=/data/appdata/kubesonarr/site_pkgs:/app
            exec python3 /app/run.py --host 0.0.0.0 --port 7890 --no-browser
        ports:
        - containerPort: 7890
          name: http
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        volumeMounts:
        - name: app-code
          mountPath: /app
        - name: data-vol
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /api/clusters
            port: 7890
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: app-code
        hostPath:
          path: /data/appdata/kubesonarr
          type: DirectoryOrCreate
      - name: data-vol
        hostPath:
          path: /data
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: kubesonarr
  namespace: monitoring
  labels:
    app: kubesonarr
spec:
  type: NodePort
  selector:
    app: kubesonarr
  ports:
  - name: http
    port: 7890
    targetPort: 7890
    nodePort: 30789
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubesonarr
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
  - host: kubesonarr.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubesonarr
            port:
              number: 7890
  - host: kubesonarr.ertechlab.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubesonarr
            port:
              number: 7890
